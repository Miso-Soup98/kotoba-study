# Prepared configuration, intentionally inactive outside .github/workflows/.
# Move to .github/workflows/cloud-build.yml after GitHub workflow authorization.
name: Cloud build (no deployment)

on:
  push:
    branches: [codex/vocabulary-v06]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Test in sequence
        run: node --experimental-strip-types --test --test-concurrency=1 tests/*.test.ts
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Preserve complete build and source provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/server/index.js
          test -s dist/.openai/hosting.json
          test -d dist/.openai/drizzle
          test -s dist/client/precache.json
          git diff --exit-code
          mkdir -p cloud-build
          git rev-parse HEAD > cloud-build/source-commit.txt
          tar -czf cloud-build/kotoba-dist.tar.gz dist
          cd cloud-build
          sha256sum kotoba-dist.tar.gz > SHA256SUMS
      - name: Store build for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotoba-build-${{ github.sha }}
          path: cloud-build/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
